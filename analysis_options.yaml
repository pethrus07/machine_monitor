# Análise estática do projeto. As regras recomendadas do Flutter cobrem a
# maior parte; abaixo reforçamos algumas que ajudam a manter o código limpo.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: false
